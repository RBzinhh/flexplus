<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexPlus - Pesquisar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Flex<span>PLUS</span></div>
        <nav class="nav-links">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Início</span></a>
            <a href="search.html" class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i><span>Pesquisar</span></a>
            <a href="favorites.html" class="nav-item"><i class="fa-solid fa-bookmark"></i><span>Favoritos</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Configurações</span></a>
        </nav>
        <div class="user-profile">
            <img id="profile-img" src="https://via.placeholder.com/40" alt="Perfil" class="avatar">
            <span id="textview_name">RBzin</span>
        </div>
    </header>

    <div class="main-container search-page">
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="edittext_search" placeholder="Pesquisar filme ou série...">
        </div>

        <div class="filter-bar">
            <div class="filter-chip active">Recomendado</div>
            <div class="filter-chip">Inglês</div>
            <div class="filter-chip">Português</div>
        </div>

        <div id="linear_main">
            <p id="textview_no_movies" class="no-movies-msg" style="display: none;">Lamentamos não termos encontrado o que você procurava...</p>
            
            <div class="section-title-search">Resultados</div>
            <div class="movie-grid-search" id="recyclerview1"></div>

            <div class="section-title-search" style="margin-top: 40px;">Recomendado</div>
            <div class="movie-grid-search" id="recyclerview2"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="search.js"></script>
</body>
</html>
