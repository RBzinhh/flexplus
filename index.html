<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexPlus - Início</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navbar / Cabeçalho Unificado -->
    <header class="navbar">
        <div class="logo">Flex<span>PLUS</span></div>
        <nav class="nav-links">
            <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Início</span></a>
            <a href="search.html" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Pesquisar</span></a>
            <a href="favorites.html" class="nav-item"><i class="fa-solid fa-bookmark"></i><span>Favoritos</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Configurações</span></a>
        </nav>
        <div class="user-profile">
            <img id="profile-img" src="https://via.placeholder.com/40" alt="Perfil" class="avatar">
            <span id="textview_name">RBzin</span>
        </div>
    </header>

    <!-- Container Principal -->
    <div class="main-container" id="vscroll_main">

        <!-- Banner Topo (Destaque) -->
        <section class="top-movie-banner" id="linear_topmovie">
            <div class="banner-bg" id="imageview_topmovie"></div>
            <div class="banner-shadow">
                <div class="banner-content">
                    <h1 id="textview_title_banner">Carregando...</h1>
                    <p id="textview_bio_">Aproveite seu conteúdo favorito</p>
                    <div class="banner-buttons">
                        <!-- Botão do Banner agora direciona para as informações (details.html) -->
                        <button class="btn-play" id="linear_play_">
                            <i class="fa-solid fa-info-circle"></i> Mais Informações
                        </button>
                        <button class="btn-list" id="linear_my_list">
                            <i class="fa-solid fa-bookmark"></i> Minha lista
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de Gêneros -->
        <section class="section-block">
            <div class="genre-container" id="recyclerview_genre"></div>
        </section>

        <!-- Categoria: Ação -->
        <section class="section-block">
            <h2 class="section-title">Ação</h2>
            <div class="movie-row" id="recyclerview_genre_selection"></div>
        </section>

        <!-- Categoria: Continue Assistindo -->
        <section class="section-block" id="linear_resume">
            <h2 class="section-title">Continue assistindo</h2>
            <div class="movie-row" id="recyclerview_resume"></div>
        </section>

        <!-- Categoria: Mais Bem Avaliados -->
        <section class="section-block">
            <h2 class="section-title">Mais bem avaliados</h2>
            <div class="movie-row" id="recyclerview_toprated"></div>
        </section>

        <!-- Categoria: Programas de TV -->
        <section class="section-block">
            <h2 class="section-title">Programas de TV</h2>
            <div class="movie-row" id="recyclerview_tvshows"></div>
        </section>

        <!-- Categoria: Novos Lançamentos -->
        <section class="section-block">
            <h2 class="section-title">Novos lançamentos</h2>
            <div class="movie-row" id="recyclerview_newreleases"></div>
        </section>

        <!-- Categoria: Adicionados Recentemente -->
        <section class="section-block">
            <h2 class="section-title">Adicionados recentemente ao <span style="color: #F71B24; margin-left: 5px;">FLEX+</span></h2>
            <div class="movie-row" id="recyclerview_newlyadded"></div>
        </section>

        <footer>
            <p>&copy; 2026 FlexPlus. Todos os direitos reservados.</p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
