<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexPlus - Pesquisar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navbar / Cabeçalho -->
    <header class="navbar">
        <div class="logo">Flex<span>PLUS</span></div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="search.html" class="active">Pesquisar</a>
            <a href="#">Minha Lista</a>
        </nav>
    </header>

    <!-- Container Principal da Pesquisa -->
    <div class="main-container search-page">
        
        <!-- Barra de Pesquisa -->
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="edittext_search" placeholder="Pesquisar filme ou série...">
        </div>

        <!-- Filtros (Recomendado, Inglês, Português) -->
        <div class="filter-bar">
            <div class="filter-chip active" id="linear_recommended_filter">Recomendado</div>
            <div class="filter-chip" id="linear_english">Inglês</div>
            <div class="filter-chip" id="linear_hindi">Português</div>
        </div>

        <!-- Mensagem de Aviso / Carregando -->
        <div id="linear_main">
            <p id="textview_no_movies" class="no-movies-msg" style="display: none;">Lamentamos não termos encontrado o que você procurava...</p>
            
            <!-- Resultados da Pesquisa -->
            <div class="section-title-search">Resultados</div>
            <div class="movie-grid-search" id="recyclerview1">
                <!-- Preenchido via JavaScript -->
            </div>

            <!-- Seção Recomendados -->
            <div class="section-title-search" style="margin-top: 30px;">Recomendado</div>
            <div class="movie-grid-search" id="recyclerview2">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="search.js"></script>
</body>
</html>
